<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnythingLLM 文档上传</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202124; background: #f5f6f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(92vw, 520px); padding: 28px; background: white; border: 1px solid #ddd; border-radius: 8px; }
    h1 { margin: 0 0 20px; font-size: 22px; }
    input, button { width: 100%; box-sizing: border-box; padding: 11px; font: inherit; }
    button { margin-top: 14px; border: 0; border-radius: 5px; background: #2563eb; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin: 16px 0 0; white-space: pre-wrap; word-break: break-word; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>上传文档到 AnythingLLM</h1>
    <input id="file" type="file" aria-label="选择文档">
    <button id="upload" type="button">上传并向量化</button>
    <div id="status" role="status">准备就绪</div>
  </main>
  <script>
    const api = 'http://localhost:3001/api/v1';
    const key = 'BE4P46K-32N4M9K-GM22MGJ-ZW6A9EP';
    const fileInput = document.querySelector('#file');
    const uploadButton = document.querySelector('#upload');
    const status = document.querySelector('#status');

    async function upload() {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = '请先选择文档';
        return;
      }
      uploadButton.disabled = true;
      status.textContent = '正在获取第一个工作区...';
      try {
        const headers = { Authorization: `Bearer ${key}` };
        const workspaceResponse = await fetch(`${api}/workspaces`, { headers });
        if (!workspaceResponse.ok) throw new Error(`获取工作区失败：HTTP ${workspaceResponse.status}`);
        const { workspaces } = await workspaceResponse.json();
        if (!workspaces?.length) throw new Error('没有可用工作区');

        const workspace = workspaces[0];
        const form = new FormData();
        form.append('file', file);
        form.append('addToWorkspaces', workspace.slug);
        status.textContent = `正在上传到「${workspace.name}」并向量化...`;
        const uploadResponse = await fetch(`${api}/document/upload`, {
          method: 'POST', headers, body: form
        });
        const result = await uploadResponse.json().catch(() => ({}));
        if (!uploadResponse.ok || result.success === false) {
          throw new Error(result.error || `上传失败：HTTP ${uploadResponse.status}`);
        }
        status.textContent = `完成：${result.documents?.[0]?.title || file.name}`;
      } catch (error) {
        status.textContent = `失败：${error.message}`;
      } finally {
        uploadButton.disabled = false;
      }
    }

    uploadButton.addEventListener('click', upload);
  </script>
</body>
</html>
